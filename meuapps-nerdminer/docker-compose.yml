version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meuapps-nerdminer_miner_1
      APP_PORT: 8080

  miner:
    # Container unico: cpuminer + painel + supervisor (ver .build/nerdminer).
    # Antes eram duas imagens (cpuminer-sha e nerdminer-ui). Foram fundidas
    # porque configurar pela UI exige reiniciar o cpuminer com argumentos
    # novos, e um container nao reinicia outro sem o socket do Docker.
    #
    # Nao ha mais bloco "command": os argumentos sao montados pelo supervisor
    # a partir do config.json, que a UI edita.
    image: ghcr.io/herigson/nerdminer:2.0.0
    restart: unless-stopped

    volumes:
      # Onde fica o config.json editado pela UI. Persiste entre updates -
      # acabou o ritual de reeditar o endereco depois de cada Update.
      - ${APP_DATA_DIR}/data:/data

    environment:
      # Credenciais RPC do Bitcoin: vem do exports.sh do app oficial. Nunca
      # sao gravadas por nos em disco nem vao para o repositorio.
      APP_BITCOIN_NODE_IP: ${APP_BITCOIN_NODE_IP}
      APP_BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      APP_BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      APP_BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      LISTEN_PORT: "8080"
      POLL_SECONDS: "10"
      PROBE_SECONDS: "30"
      NODE_INFO_TTL: "60"

    deploy:
      resources:
        limits:
          # TETO DE CPU = TETO DE TEMPERATURA, e ele mora AQUI, nao na UI:
          # um container nao altera o proprio limite. 0.6 mantem o calor no
          # mesmo patamar de antes (miner 0.5 + painel 0.25, separados).
          # Para esquentar menos, baixe este numero.
          cpus: "0.6"
          # O cpuminer vaza memoria no caminho getblocktemplate (~85 MiB/h
          # com scantime 60; era ~1 GiB/h com o padrao de 5s do upstream).
          # Este teto faz o kernel reiniciar o container em vez de derrubar o
          # Umbrel inteiro - com "restart: unless-stopped", invisivel.
          memory: 1G
