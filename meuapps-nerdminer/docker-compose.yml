version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meuapps-nerdminer_miner_1
      APP_PORT: 8080

  miner:
    # Container unico: cpuminer + painel + supervisor (ver .build/nerdminer).
    # Antes eram duas imagens (cpuminer-sha e nerdminer-ui). Foram fundidas
    # porque configurar pela UI exige reiniciar o cpuminer com argumentos
    # novos, e um container nao reinicia outro sem o socket do Docker.
    #
    # Nao ha mais bloco "command": os argumentos sao montados pelo supervisor
    # a partir do config.json, que a UI edita.
    image: ghcr.io/herigson/nerdminer:2.5.0
    restart: unless-stopped

    volumes:
      # Onde fica o config.json editado pela UI. Persiste entre updates -
      # acabou o ritual de reeditar o endereco depois de cada Update.
      - ${APP_DATA_DIR}/data:/data

    environment:
      # Credenciais RPC do Bitcoin: vem do exports.sh do app oficial. Nunca
      # sao gravadas por nos em disco nem vao para o repositorio.
      APP_BITCOIN_NODE_IP: ${APP_BITCOIN_NODE_IP}
      APP_BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      APP_BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      APP_BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      LISTEN_PORT: "8080"
      POLL_SECONDS: "10"
      PROBE_SECONDS: "30"
      NODE_INFO_TTL: "60"

    deploy:
      resources:
        limits:
          # Teto de fatia de CPU. O controle de TEMPERATURA agora e pela UI
          # (--max-temp do cpuminer), que e o jeito certo: mede o que importa.
          # Aqui fica so o limite de quanto o miner pode tomar dos outros
          # apps - 0.5 e o valor que rodou por semanas (~11,4 MH/s).
          cpus: "0.5"
          # O cpuminer vaza memoria no caminho getblocktemplate. MEDIDO em
          # 28/09/2026 com scantime 60: ~105 MiB/h (base ~57 MiB), ou seja
          # ~9h por ciclo ate bater neste teto. Com o padrao de 5s do
          # upstream eram ~1 GiB/h, que derrubou a maquina 3x.
          # O teto faz o kernel reiniciar so o container - com
          # "restart: unless-stopped", alguns segundos e invisivel.
          memory: 1G
