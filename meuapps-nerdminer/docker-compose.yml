version: "3.7"

services:
  app_proxy:
    environment:
      # O botao Open agora abre o painel (antes caia na API texto do cpuminer
      # e o navegador so mostrava ECONNRESET).
      APP_HOST: meuapps-nerdminer_ui_1
      APP_PORT: 8080

  miner:
    # Build proprio do cpuminer-opt com SHA-NI (ver .build/cpuminer-sha).
    # As imagens publicas sao compiladas sem SHA e rendem ~5.5 MH/s por
    # thread neste N100; esta rende ~27 MH/s por thread e roda mais fria.
    image: ghcr.io/herigson/cpuminer-sha:26.1
    restart: unless-stopped
    # A imagem tem ENTRYPOINT ["cpuminer"], entao aqui vao SO os argumentos -
    # nao repetir "cpuminer" na primeira linha (era assim na imagem antiga).
    #
    # TROQUE SEU_ENDERECO_BTC pelo seu endereco Bitcoin real (bc1..., em
    # minusculas). O sufixo .umbrel e so o nome do worker no dashboard.
    command:
      - -a
      - sha256d
      - -o
      - stratum+tcp://public-pool.io:21496
      - -u
      - SEU_ENDERECO_BTC.umbrel
      - -p
      - x
      - -t
      - "1"
      # O --api-bind ja define QUEM pode conectar e em que porta, no formato
      # <ip>:<porta>. O literal 0.0.0.0 e o "aceita todos" do cpuminer
      # (ALLIP4 no api.c: zera ip e mascara), necessario pro painel, que fala
      # de outro container. NAO existe a opcao --api-allow: passa-la derruba
      # o miner em loop ("unrecognized option").
      # A 4048 nao e publicada no host - so a rede interna do app alcanca -
      # e o acesso e somente leitura (comandos remotos exigem --api-remote).
      - --api-bind
      - 0.0.0.0:4048
    # 1 thread + meio nucleo: com SHA-NI isso ja da ~11 MH/s, quatro vezes o
    # que 2 threads davam antes, e sem passar dos 80 C (o episodio dos 89 C
    # foi com 2 threads no binario sem SHA).
    deploy:
      resources:
        limits:
          cpus: "0.5"

  ui:
    # Painel web: le a API do miner e serve o dashboard (ver .build/nerdminer-ui).
    image: ghcr.io/herigson/nerdminer-ui:1.0.1
    restart: unless-stopped
    depends_on:
      - miner
    environment:
      # Na rede do Umbrel vale o nome COMPLETO do container (mesmo formato do
      # APP_HOST); o nome curto "miner" nao resolve. O painel testa a lista em
      # ordem e fica com o primeiro que responder - o ultimo item cobre a
      # nomenclatura com hifen que o Compose v2 usa.
      MINER_HOST: "meuapps-nerdminer_miner_1,miner,meuapps-nerdminer-miner-1"
      MINER_PORT: "4048"
      LISTEN_PORT: "8080"
      POLL_SECONDS: "10"
      # 720 pontos a cada 10s = 2h de historico no grafico
      HISTORY_POINTS: "720"
    deploy:
      resources:
        limits:
          cpus: "0.25"
