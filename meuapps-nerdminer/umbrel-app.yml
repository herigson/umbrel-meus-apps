manifestVersion: 1
id: meuapps-nerdminer
name: NerdMiner CPU (Loteria)
tagline: Mineracao solo de Bitcoin contra o seu proprio node, configuravel pela UI
icon: https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/bitcoin/icon.svg
category: Finances
version: "27.5.0"
port: 4048
description: >-
  Minerador de Bitcoin por CPU (cpuminer-opt) que minera SOLO contra o seu
  proprio Bitcoin Node, via getblocktemplate - sem pool, sem intermediario,
  sem taxa. Funciona como uma loteria: a chance de achar um bloco e
  minuscula, mas se acontecer, a recompensa inteira vai para o SEU endereco.


  TUDO SE CONFIGURA PELO PROPRIO APP. Abra o painel, va em Configuracao e
  informe o endereco Bitcoin. Nao e mais preciso editar docker-compose.yml, e
  a configuracao sobrevive aos updates (fica em ${APP_DATA_DIR}).


  O painel mostra hashrate ao vivo com historico de 1h, 24h e 7 dias,
  dificuldade e altura do bloco lidas do SEU node (nao de API publica),
  proximo halving, temperatura, e a chance por dia de achar um bloco. Da pra
  pausar e retomar a mineracao, trocar entre solo e pool, e ajustar threads e
  scantime sem tocar em arquivo nenhum.


  Usa uma imagem propria com as instrucoes SHA-NI do processador ligadas, o
  que rende ~5x mais hashrate que as imagens publicas de cpuminer e ainda
  esquenta menos.


  O teto de CPU (que na pratica e o teto de temperatura) e o de memoria ficam
  no docker-compose.yml, porque um container nao consegue alterar os proprios
  limites.
releaseNotes: >-
  O app passa a reiniciar o cpuminer ANTES de ele encostar no teto de
  memoria, em vez de esperar travar.


  A 2.4.0 pos um resgate automatico no ar e ele funcionou - tres vezes em
  36h, com uma regularidade de relogio: 11h31, 11h37 e 11h17 entre um e
  outro. Isso e exatamente 1 GiB dividido por ~89 MiB/h, a taxa do vazamento
  do work_copy() no caminho getblocktemplate. Nao e evento raro: e ciclo.


  E ao encostar no teto o cpuminer NAO morre - ele fica preso em recuperacao
  de memoria, vivo e sem progredir. stdout mudo, API muda, e o poll() do
  supervisor respondendo "vivo" com toda a razao. Por isso quem pegava era o
  resgate, que exige 5 minutos de silencio pra ter certeza: cinco minutos de
  tela cega, tres vezes por dia.


  Agora o supervisor le o RSS do cpuminer em /proc a cada 5s e o reinicia ao
  cruzar 75% do teto - ~5 segundos a cada ~8h30, em vez de ~5 minutos a cada
  ~11h30. O limiar sai do proprio cgroup, entao acompanha sozinho quem mudar
  o "memory:" no compose, sem numero magico repetido em dois arquivos. O
  trabalho perdido e irrelevante: em loteria solo cada hash e independente, e
  um reinicio nao joga progresso nenhum fora.


  O resgate da 2.4.0 continua no lugar como ultima linha de defesa, pra
  qualquer travamento que nao seja memoria.


  O card Dispositivo passa a mostrar a memoria do miner com o limiar junto
  ("412 MiB - reinicia em 768 MiB") e as contagens de reinicio preventivo e
  de resgate. E as linhas de log do proprio app agora saem com data e hora,
  no mesmo formato das do cpuminer - sem isso as duas coisas nao podiam ser
  lidas na mesma linha do tempo, o que atrapalhou este diagnostico.


  A 27.4.0 corrigiu o painel que dizia "producao parada" com o minerador
  trabalhando, e o supervisor que nao percebia a morte do cpuminer.


  O que aconteceu em 29/09/2026: as 04:49 o cpuminer chegou ao teto de 1 GiB
  de memoria e foi morto pelo OOM killer do cgroup - que e exatamente o que
  esse teto existe pra fazer, ja que ele vaza ~91 MiB/h. So que ninguem subiu
  outro. O painel passou NOVE HORAS dizendo "rodando", com restarts: 0 e o
  hashrate congelado na ultima leitura antes da morte.


  Sao duas falhas somadas. A primeira: o supervisor consultava
  _state["running"] - memoria, nao verificacao - pra decidir se devia subir
  outro processo. Bastava esse campo dessincronizar de _proc pra condicao
  nunca mais disparar, e ele ficava de bracos cruzados pra sempre sem avisar
  ninguem. Agora a condicao e a verdade nua (e pra rodar e nao ha processo),
  o corpo do laco inteiro vai num try/except pra que uma excecao nao mate a
  thread em silencio, e o _kill tambem captura TimeoutExpired, que nao e
  OSError e escapava deixando o estado incoerente.


  A segunda: o painel tratava "API do miner sem responder" como "producao
  parada" e estampava 0 H/s em vermelho. Mas sem medicao nao e sem producao -
  o cpuminer estava a 10,5 MH/s do outro lado. Agora existe o estado
  "minerando sem telemetria", que vale quando a API esta muda mas o cpuminer
  continua escrevendo no stdout: o hashrate vira "-" em vez de um zero
  inventado, e um aviso explica que os numeros na tela sao a ultima medicao,
  nao o estado de agora.


  E um resgate automatico: quando a API fica muda E o stdout fica calado por
  mais de 5 minutos, os dois sinais juntos nao tem leitura inocente, e o app
  sobe outro cpuminer sozinho. Ha carencia de 60s e no maximo um resgate a
  cada 10 min, pra que um defeito permanente vire um reinicio periodico em
  vez de um laco de reinicios. O contador aparece no card Dispositivo.


  A 27.3.0 trouxe o limite de CPU pela interface. A 27.0.0 nao conseguia
  salvar a configuracao
  ("Permission denied: /data/.config-*.tmp"). O Umbrel monta
  ${APP_DATA_DIR}/data em /data, e quando esse diretorio ainda nao existe no
  host quem o cria e o Docker - como root. O chown feito no Dockerfile nao
  ajudava: o bind-mount cobre o diretorio da imagem, e o dono que vale e o do
  host. Agora o processo sobe como root so pra ajustar o dono e cai pra uid
  1000 imediatamente, antes de abrir socket, thread ou processo filho - entao
  nem o painel nem o cpuminer rodam com privilegio.


  REESCRITA. O app virou um container so (cpuminer + painel + supervisor) e
  ganhou configuracao pela interface. Nao ha mais placeholder pra reeditar
  depois de cada Update: o config.json fica em ${APP_DATA_DIR} e sobrevive.


  O que muda pra quem ja usa: ao atualizar, abra o painel e informe o
  endereco Bitcoin em Configuracao. Enquanto ele estiver vazio, o minerador
  nao sobe - de proposito, pra nao minerar pra endereco de ninguem.


  Configuravel pela UI: endereco, modo (solo contra o node ou pool stratum),
  threads, scantime, e pausar/retomar. O teto de CPU e de memoria continuam
  no docker-compose.yml, porque um container nao altera os proprios limites -
  e o teto de CPU e, na pratica, o teto de temperatura.


  Painel novo: historico de 1h/24h/7d, dificuldade e altura do bloco lidas do
  SEU node via RPC (nao de API publica, entao funciona sem internet), proximo
  halving, e a chance por dia de achar um bloco. Estado com cor E rotulo,
  nunca cor sozinha.


  Cuidados de memoria, depois do episodio de 24/09 (o cpuminer vazava ~1
  GiB/h e travou o Umbrel tres vezes): scantime padrao de 60s em vez dos 5s
  do upstream (12x menos vazamento), teto de memoria no compose pro kernel
  reiniciar o container em vez de derrubar a maquina, todo historico em
  deques com maxlen, um unico processo filho por vez sempre reapeado, e o
  stdout do cpuminer drenado por uma thread - sem isso o pipe encheria e o
  minerador travaria.


  Inclui a correcao do estouro de buffer no summary da API do cpuminer
  (diff_str de 16 bytes recebendo 23), que fazia o campo ALGO aparecer como
  numero.


  A 26.2.2 corrigia esse estouro de buffer: o rodape
  mostrava "algoritmo: 218750" em vez de "sha256d". Nao era erro de leitura -
  a API do miner emitia isso mesmo.


  Causa: em api.c o buffer "char diff_str[16]" recebe a dificuldade impressa
  com 6 decimais. Na mainnet isso da 22 caracteres + terminador = 23 bytes.
  Os 7 que sobram invadem o buffer vizinho ("char algo[64]"), e sobra la o
  final do numero. O DIFF so aparecia inteiro por acidente, porque o %s lia
  alem do diff_str e emendava no algo. E um estouro de pilha, disparado a
  cada chamada de summary - ou seja, a cada poll do painel.


  Como a imagem e build proprio, o patch vai no Dockerfile: diff_str passa a
  48 bytes. Ha greps antes e depois do sed para o build FALHAR se o upstream
  mudar a linha, em vez de aplicar um patch vazio em silencio.


  A imagem ganhou sufixo de revisao: 26.1 -> 26.1-r1. Sem isso, dois builds
  de conteudo diferente ficariam com a mesma tag. O sufixo sai do arquivo
  .build/cpuminer-sha/REVISION.


  A 26.2.1 corrigiu o manifesto que sumiu da loja: o manifesto ficou com a chave
  "dependencies" DUPLICADA - a nova no topo e a "dependencies: []" que ja
  existia no fim do arquivo. YAML com chave repetida e recusado pelo parser
  do umbreld, entao o app inteiro era descartado do registro (os containers
  seguiam rodando; so a entrada na loja sumia). Agora ha uma unica chave.


  MINERACAO SOLO CONTRA O SEU PROPRIO NODE. O app deixa de depender do
  public-pool.io: o cpuminer fala getblocktemplate direto com o Bitcoin Core
  do seu Umbrel e submete o bloco ele mesmo via submitblock. Sem pool, sem
  intermediario, sem taxa - se voce achar um bloco, a recompensa inteira mais
  as taxas vao direto pro endereco em --coinbase-addr.


  Motivacao concreta: em 23/09/2026 a public-pool.io ficou mais de um dia
  fora do ar e a mineracao parou junto. Com o node proprio some essa
  dependencia.


  O app agora declara dependencia do Bitcoin Node e consome as variaveis que
  ele exporta (APP_BITCOIN_NODE_IP, APP_BITCOIN_RPC_USER/PASS, RPC_PORT) -
  mesmo padrao do Electrs oficial. Nenhuma credencial fica escrita no
  repositorio.


  ATENCAO: em solo o coinbase paga EXATAMENTE o endereco configurado, e nao
  ha operador de pool pra corrigir engano. Confira caractere a caractere
  depois de editar o compose. O caminho de submitblock so executa quando um
  bloco e achado - se quiser ensaiar antes, da pra rodar a mesma configuracao
  contra um bitcoind em regtest, onde blocos aparecem em segundos.


  No painel (nerdminer-ui 1.2.0): o modo solo e detectado pelo esquema da URL
  (http:// = GBT, stratum+tcp:// = pool). Em solo nao existem shares, entao os
  quadros de share dao lugar a um quadro "Modo", a deteccao de share
  estagnada e desligada e o alvo passa a se chamar "node" em vez de "pool".


  Pra voltar ao pool publico, o compose traz o bloco comentado com as linhas
  a trocar.


  A 26.1.5 fez o painel distinguir "o miner esta vivo" de "estou minerando". Ate aqui
  ele so perguntava se a API do cpuminer respondia - e ela responde mesmo com
  a pool fora, entao numa queda do public-pool.io o painel seguia dizendo
  "minerando", com o ultimo hashrate congelado e o grafico numa linha reta.


  Tres mudancas: o painel passa a sondar a pool por TCP (POOL_URL no compose,
  a cada 30s); detecta share aceita estagnada (ACC parado por mais de 15 min,
  que pega falha silenciosa da pool mesmo com a porta aberta); e grava zero no
  historico durante a queda, porque producao parada e zero - a linha reta era
  justamente a informacao errada. O estado aparece com cor E rotulo ("pool
  fora - nao esta minerando"), mais um quadro novo com o estado da pool.


  Nada a fazer quando isso acontece: o cpuminer reconecta sozinho, e em
  loteria solo share nao acumula valor.


  A 26.1.4 trouxe ajustes no painel: a frequencia aparecia como "1123.68 GHz" (o cpuminer
  informa FREQ em kHz, nao em MHz) e o rotulo do topo do eixo Y estourava a
  margem - agora a unidade aparece uma vez como legenda e os ticks ficam
  numeros puros. /api/stats passa a incluir a resposta crua da API do miner,
  pra facilitar diagnostico.


  A 26.1.3 corrigiu o "--api-allow", opcao
  que NAO existe - o miner saia na inicializacao e ficava em loop de restart,
  ou seja, parou de minerar. O parametro foi removido. Quem estiver em
  26.1.1/26.1.2 deve atualizar (ou apagar as duas linhas do --api-allow no
  docker-compose.yml e reiniciar o app).


  O --api-bind 0.0.0.0:4048, que ja existia, sozinho ja libera o acesso de
  qualquer origem: no cpuminer o literal 0.0.0.0 significa "aceita todos"
  (ALLIP4 no api.c).


  Tambem corrige o painel, que subia sem contato com o miner ("Name or service not
  known"): na rede do Umbrel os containers se enxergam pelo nome completo
  (meuapps-nerdminer_miner_1), nao pelo nome curto do servico. O painel agora
  testa uma lista de nomes e usa o primeiro que responder.


  Versao anterior (26.1.1) adicionou um painel web proprio (servico "ui", imagem ghcr.io/herigson/
  nerdminer-ui): hashrate ao vivo com grafico de 2h, shares, temperatura,
  frequencia, uptime, contador de blocos e o tempo medio estimado por bloco.
  O botao Open passa a abrir esse painel em vez de bater na API texto do
  cpuminer, que so devolvia erro de conexao no navegador.


  O miner ganhou "--api-allow 0/0" porque a API do cpuminer, por padrao, so
  aceita 127.0.0.1 e recusaria o painel. A porta 4048 continua sem publicacao
  no host: so alcancavel de dentro da rede interna do app, e somente leitura.


  Versao anterior (26.1): trocou a imagem publica por um build proprio do
  cpuminer-opt compilado com -march=alderlake, o que ligou as instrucoes
  SHA-NI do processador - 5.55 para 27 MH/s por thread, com a temperatura
  caindo de 82 para 75 C. O padrao tambem passou de 2 threads / 2 CPUs para
  1 thread / 0.5 CPU.


  ATENCAO: este update regenera o docker-compose.yml e devolve o placeholder
  SEU_ENDERECO_BTC - reaplique seu endereco depois de atualizar.
