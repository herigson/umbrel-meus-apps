<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servidor NTP</title>
<style>
  :root {
    color-scheme: dark;
    --page:     #0d0d0d;
    --surface:  #1a1a19;
    --ink:      #ffffff;
    --ink-2:    #c3c2b7;
    --muted:    #898781;
    --grid:     #2c2c2a;
    --axis:     #383835;
    --series:   #3987e5;
    --good:     #0ca30c;
    --warning:  #fab219;
    --critical: #d03b3b;
    --border:   rgba(255, 255, 255, 0.10);
    --radius: 12px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: var(--page); color: var(--ink);
    font-size: 15px; line-height: 1.45;
  }
  .wrap { max-width: 940px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  .sub { color: var(--muted); font-size: .82rem; margin-left: auto; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); font-size: .78rem; color: var(--ink-2);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--good); }
  .dot.bad { background: var(--critical); }
  .dot.warn { background: var(--warning); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }
  .card h2 {
    font-size: .78rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); margin: 0 0 10px;
  }
  .hint { color: var(--muted); font-size: .8rem; margin: 6px 0 0; }

  .hero { display: flex; align-items: baseline; gap: 10px; }
  .hero .value { font-size: 3rem; font-weight: 650; line-height: 1; }
  .hero .unit { font-size: 1.1rem; color: var(--ink-2); }

  figure { margin: 14px 0 0; position: relative; }
  svg { display: block; width: 100%; height: 170px; touch-action: none; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0;
    transform: translate(-50%, -100%);
    background: var(--page); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: .78rem; white-space: nowrap;
    transition: opacity .1s linear;
  }
  .tip .t { color: var(--muted); font-size: .72rem; }

  .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .tile .k {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin-bottom: 4px;
  }
  .tile .v { font-size: 1.35rem; font-weight: 600; word-break: break-word; }
  .tile .n { font-size: .75rem; color: var(--muted); margin-top: 2px; }

  table { border-collapse: collapse; width: 100%; font-size: .82rem; }
  th, td {
    text-align: right; padding: 6px 8px;
    border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  .scroll { overflow-x: auto; }

  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--ink-2); font-size: .82rem; padding: 6px 0; }

  .clockcard { text-align: center; padding: 26px 18px 20px; }
  .clockcard .time {
    font-size: clamp(2.6rem, 12vw, 4.4rem); font-weight: 650;
    line-height: 1; letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
  }
  .clockcard .date {
    color: var(--ink-2); font-size: .95rem; margin-top: 8px;
    text-transform: capitalize;
  }
  .clockcard .zone { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .clockcard .serving {
    color: var(--muted); font-size: .78rem; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid var(--grid);
  }

  .banner {
    background: var(--surface); border: 1px solid var(--critical);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px;
    color: var(--ink-2); font-size: .86rem;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Servidor NTP</h1>
    <span class="pill" id="status"><span class="dot warn"></span><span id="statusText">consultando…</span></span>
    <span class="sub" id="updated"></span>
  </header>

  <div class="banner hidden" id="banner"></div>

  <section class="card clockcard">
    <div class="time" id="time">--:--:--</div>
    <div class="date" id="date"></div>
    <div class="zone" id="zone"></div>
    <div class="serving" id="serving"></div>
  </section>

  <section class="card">
    <h2>Desvio do relógio</h2>
    <div class="hero">
      <span class="value" id="offset">—</span>
      <span class="unit" id="offsetUnit"></span>
    </div>
    <p class="hint" id="offsetHint">medido contra as fontes públicas de referência</p>
    <figure>
      <svg id="chart" role="img" aria-label="Desvio do relógio ao longo do tempo"></svg>
      <div class="tip" id="tip"></div>
    </figure>
    <details>
      <summary>Ver dados do gráfico</summary>
      <div class="scroll">
        <table id="dataTable">
          <thead><tr><th>Horário</th><th>Desvio</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </details>
  </section>

  <section class="tiles" id="tiles"></section>

  <section class="card">
    <h2>Fontes de referência</h2>
    <div class="scroll">
      <table id="refs">
        <thead><tr><th>Servidor</th><th>Stratum</th><th>Desvio</th><th>Ida e volta</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer style="color:var(--muted);font-size:.78rem;padding:4px 2px 0" id="footer"></footer>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const CHART = { pad: { top: 16, right: 8, bottom: 22, left: 52 } };
let state = { local: {}, references: [], history: [] };
// Diferenca entre o relogio do servidor e o do navegador. O painel mostra a
// hora SERVIDA, entao o relogio continua certo mesmo num dispositivo atrasado.
let skew = 0;
let zone = null;

/* ---------- formatadores ---------- */

function seconds(value) {
  const s = Number(value) || 0;
  const abs = Math.abs(s);
  if (abs >= 1) return [s.toFixed(2), "s"];
  if (abs >= 0.001) return [(s * 1000).toFixed(1), "ms"];
  return [(s * 1e6).toFixed(0), "µs"];
}

function signed(value) {
  const [v, u] = seconds(value);
  return (Number(value) >= 0 ? "+" : "") + v + " " + u;
}

function clock(ts) {
  return new Date(ts * 1000).toLocaleTimeString("pt-BR",
    { hour: "2-digit", minute: "2-digit" });
}

function ago(ts) {
  if (!ts) return "—";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return "há " + s + "s";
  if (s < 3600) return "há " + Math.floor(s / 60) + "min";
  return "há " + Math.floor(s / 3600) + "h";
}

/* Qualidade do desvio: os limiares seguem cor + rotulo, nunca so cor. */
function quality(offsetSeconds) {
  const ms = Math.abs(Number(offsetSeconds) || 0) * 1000;
  if (ms < 50) return { cls: "ok", label: "sincronizado" };
  if (ms < 500) return { cls: "warn", label: "desvio perceptível" };
  return { cls: "bad", label: "fora de sincronia" };
}

/* ---------- relogio ---------- */

function tzOptions(base) {
  const opts = Object.assign({}, base);
  // Formata no fuso do servidor. Se o navegador nao conhecer o nome IANA,
  // cai no fuso local em vez de quebrar.
  if (zone && zone.timezone) {
    try {
      new Intl.DateTimeFormat("pt-BR", { timeZone: zone.timezone });
      opts.timeZone = zone.timezone;
    } catch (err) { /* fuso desconhecido: usa o local */ }
  }
  return opts;
}

function tickClock() {
  const now = new Date((Date.now() / 1000 + skew) * 1000);
  $("time").textContent = now.toLocaleTimeString("pt-BR",
    tzOptions({ hour: "2-digit", minute: "2-digit", second: "2-digit" }));
  $("date").textContent = now.toLocaleDateString("pt-BR",
    tzOptions({ weekday: "long", day: "2-digit", month: "long", year: "numeric" }));
  if (zone) {
    $("zone").textContent = zone.timezone + " · " + zone.abbreviation +
                            " · UTC" + zone.utcOffset;
  }
}

/* ---------- grafico: linha com zero de referencia ---------- */

function drawChart() {
  const svg = $("chart");
  const pts = state.history;
  svg.innerHTML = "";
  if (pts.length < 2) return;

  const w = svg.clientWidth || 600;
  const h = svg.clientHeight || 170;
  const { top, right, bottom, left } = CHART.pad;
  const plotW = Math.max(1, w - left - right);
  const plotH = Math.max(1, h - top - bottom);

  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const span = Math.max(1, t1 - t0);
  // Escala simetrica em torno do zero: desvio tem sinal, e o zero e a
  // referencia que importa - nao a base do grafico.
  const peak = Math.max(...pts.map((p) => Math.abs(p[1])), 0.001);
  const yMax = peak * 1.25;

  const X = (t) => left + ((t - t0) / span) * plotW;
  const Y = (v) => top + plotH / 2 - (v / yMax) * (plotH / 2);

  const ns = "http://www.w3.org/2000/svg";
  const add = (tag, attrs, parent) => {
    const el = document.createElementNS(ns, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(el);
    return el;
  };

  const unit = seconds(yMax)[1];
  const divisor = { s: 1, ms: 1e-3, "µs": 1e-6 }[unit];

  const caption = add("text", { x: 2, y: 10, fill: "var(--muted)", "font-size": "11" });
  caption.textContent = unit;

  for (const v of [yMax, 0, -yMax]) {
    const y = Y(v);
    add("line", {
      x1: left, y1: y, x2: w - right, y2: y,
      stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1
    });
    const label = add("text", {
      x: left - 8, y: y + 4, "text-anchor": "end",
      fill: "var(--muted)", "font-size": "11"
    });
    label.style.fontVariantNumeric = "tabular-nums";
    label.textContent = v === 0 ? "0" : (v / divisor).toFixed(1);
  }

  for (let i = 0; i <= 3; i++) {
    const t = t0 + (span / 3) * i;
    const label = add("text", {
      x: X(t), y: h - 6,
      "text-anchor": i === 0 ? "start" : i === 3 ? "end" : "middle",
      fill: "var(--muted)", "font-size": "11"
    });
    label.style.fontVariantNumeric = "tabular-nums";
    label.textContent = clock(t);
  }

  const line = pts.map((p, i) =>
    (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  add("path", {
    d: line, fill: "none", stroke: "var(--series)",
    "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"
  });

  const cross = add("line", { y1: top, y2: top + plotH, stroke: "var(--axis)", "stroke-width": 1, opacity: 0 });
  const marker = add("circle", { r: 4, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2, opacity: 0 });
  const tip = $("tip");

  const onMove = (evt) => {
    const box = svg.getBoundingClientRect();
    const x = (evt.touches ? evt.touches[0].clientX : evt.clientX) - box.left;
    const t = t0 + ((x - left) / plotW) * span;
    let best = pts[0];
    for (const p of pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
    const px = X(best[0]), py = Y(best[1]);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("opacity", 1);
    marker.setAttribute("cx", px); marker.setAttribute("cy", py); marker.setAttribute("opacity", 1);
    tip.innerHTML = "<strong>" + signed(best[1]) + "</strong><div class='t'>" + clock(best[0]) + "</div>";
    tip.style.left = px + "px"; tip.style.top = (py - 10) + "px"; tip.style.opacity = 1;
  };
  const onLeave = () => {
    cross.setAttribute("opacity", 0);
    marker.setAttribute("opacity", 0);
    $("tip").style.opacity = 0;
  };
  svg.addEventListener("mousemove", onMove);
  svg.addEventListener("mouseleave", onLeave);
  svg.addEventListener("touchmove", onMove, { passive: true });
  svg.addEventListener("touchend", onLeave);
}

/* ---------- render ---------- */

function tile(k, v, n) {
  return "<div class='tile'><div class='k'>" + k + "</div><div class='v'>" + v +
         "</div>" + (n ? "<div class='n'>" + n + "</div>" : "") + "</div>";
}

function render() {
  const local = state.local || {};
  const refs = state.references || [];
  const good = refs.filter((r) => !r.error);
  const serving = !local.error;

  // O offset exibido vem das fontes externas: comparar com o servidor local
  // daria sempre zero (mesmo relogio do host).
  const latest = state.history.length ? state.history[state.history.length - 1][1] : null;
  const q = latest === null ? { cls: "warn", label: "aguardando referência" } : quality(latest);

  const dot = $("status").querySelector(".dot");
  dot.className = "dot " + (serving ? q.cls : "bad");
  $("statusText").textContent = serving ? q.label : "servidor não responde";

  const banner = $("banner");
  if (local.error) {
    banner.textContent = "Não foi possível consultar o servidor NTP local — " + local.error;
    banner.classList.remove("hidden");
  } else if (good.length === 0 && refs.length) {
    banner.textContent = "Nenhuma fonte de referência respondeu — o desvio não pode ser medido. " +
                         "Verifique a saída para a internet e o DNS.";
    banner.classList.remove("hidden");
  } else {
    banner.classList.add("hidden");
  }

  if (latest === null) {
    $("offset").textContent = "—";
    $("offsetUnit").textContent = "";
  } else {
    const [v, u] = seconds(latest);
    $("offset").textContent = (latest >= 0 ? "+" : "") + v;
    $("offsetUnit").textContent = u;
  }

  $("tiles").innerHTML =
    tile("Stratum", serving && local.stratum ? local.stratum : "—",
         local.stratum === 2 ? "sincronizado com stratum 1" :
         local.stratum ? "camadas até a fonte primária" : "") +
    tile("Referência", serving ? (local.refId || "—") : "—", "fonte usada pelo chrony") +
    tile("Último sync", serving ? ago(local.refTime) : "—",
         serving && local.refTime ? new Date(local.refTime * 1000).toLocaleTimeString("pt-BR") : "") +
    tile("Erro estimado", serving && local.rootDispersion !== undefined
         ? signed(local.rootDispersion).replace("+", "±") : "—", "root dispersion") +
    tile("Atraso à origem", serving && local.rootDelay !== undefined
         ? seconds(local.rootDelay).join(" ") : "—", "root delay") +
    tile("Fontes ativas", refs.length ? good.length + " de " + refs.length : "—",
         "consulta a cada " + Math.round((state.referencePoll || 120) / 60) + " min");

  $("refs").querySelector("tbody").innerHTML = refs.map((r) => {
    if (r.error) {
      return "<tr><td>" + r.host + "</td><td colspan='3' style='text-align:right;color:var(--muted)'>" +
             "sem resposta</td></tr>";
    }
    return "<tr><td>" + r.host + "</td><td>" + r.stratum + "</td><td>" +
           signed(r.offset) + "</td><td>" + seconds(r.delay).join(" ") + "</td></tr>";
  }).join("") || "<tr><td colspan='4' style='color:var(--muted)'>aguardando…</td></tr>";

  $("serving").textContent = serving
    ? "servindo em " + (location.hostname || "este servidor") + " · porta 123/UDP"
    : "o servidor NTP não está respondendo";

  $("dataTable").querySelector("tbody").innerHTML = state.history.slice(-60).reverse()
    .map((p) => "<tr><td>" + clock(p[0]) + "</td><td>" + signed(p[1]) + "</td></tr>").join("");

  $("footer").textContent = serving
    ? "chrony · versão NTP " + (local.version || "?") + " · precisão 2^" + (local.precision || "?") + " s"
    : "";
  $("updated").textContent = "atualizado " + new Date().toLocaleTimeString("pt-BR");
  drawChart();
}

async function tick() {
  try {
    const res = await fetch("api/stats", { cache: "no-store" });
    state = await res.json();
    if (state.clock) {
      zone = state.clock;
      skew = state.clock.epoch - Date.now() / 1000;
    }
  } catch (err) {
    state.local = { error: "painel não conseguiu falar com o próprio backend" };
  }
  render();
  tickClock();
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawChart, 150);
});

tick();
setInterval(tick, 10000);
setInterval(tickClock, 1000);
</script>
</body>
</html>
