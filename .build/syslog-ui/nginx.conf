# Config COMPLETA do nginx, assada na imagem em /etc/nginx/nginx.conf - e
# nao um fragmento em conf.d/default.conf. O motivo e uma linha so: "user"
# e diretiva de contexto principal e nao existe dentro de conf.d.
#
# Sem ela o worker roda como uid 101 (nginx) e NAO consegue apagar os
# arquivos de log, porque o syslog-ng os cria como root em diretorio 0755.
# Apagar um arquivo depende de permissao de escrita no DIRETORIO, nao no
# arquivo - entao nem o 0644 nem o :rw no volume resolvem sozinhos.
#
# O custo disso e real: o worker do nginx passa a rodar como root. Aceitavel
# aqui porque ele so serve um diretorio estatico, atras da autenticacao do
# app_proxy, numa LAN domestica. Nao replique esse arquivo num servidor
# exposto.
user root;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    off;
    charset       utf-8;

    server {
        listen 80;
        server_name _;

        # A pagina do visualizador. Arquivo unico, sem nenhum recurso
        # externo: esta tela precisa funcionar justamente quando a internet
        # esta fora.
        location = / {
            root /app;
            try_files /index.html =404;
            # Sem isso o navegador segura a pagina antiga depois de uma
            # atualizacao e voce fica depurando um arquivo que ja mudou.
            add_header Cache-Control "no-store";
        }

        # Listagem em JSON, consumida pela pagina, e os proprios arquivos.
        # .log nao esta no mime.types do nginx e cairia em
        # application/octet-stream, o que faz o navegador baixar em vez de
        # exibir. text/plain abre na tela.
        #
        # "root /" em vez de "alias /logs/": com root, a URI /logs/x vira
        # exatamente /logs/x no disco, e some o comportamento conhecido de
        # alias combinado com o modulo dav.
        location /logs/ {
            root /;
            autoindex on;
            autoindex_format json;
            default_type text/plain;
            add_header Cache-Control "no-store";

            # O botao de apagar da tela. So DELETE - sem PUT, sem MKCOL:
            # ninguem precisa ESCREVER log por HTTP, e um metodo a mais aqui
            # seria uma forma de injetar evidencia falsa no proprio arquivo
            # que existe para servir de prova.
            dav_methods DELETE;
            limit_except GET DELETE { deny all; }
        }

        # Rede de seguranca: se a pagina quebrar, /raw/ continua dando a
        # listagem HTML simples de sempre. Mesmo diretorio, outro formato,
        # e aqui SEM DELETE.
        location /raw/ {
            alias /logs/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            default_type text/plain;
            limit_except GET { deny all; }
        }
    }
}
