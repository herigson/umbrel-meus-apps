@version: 4.11

# Recebe de qualquer aparelho da LAN que fale syslog.
source s_rede {
  network(transport("udp") port(514));
};

# Um arquivo por host e por dia: /logs/<host>/2026-11-16.log
# As permissoes sao explicitas porque o container "web" (nginx) le este
# mesmo diretorio como somente-leitura e roda com usuario proprio.
destination d_por_host {
  file("/logs/${HOST}/${YEAR}-${MONTH}-${DAY}.log"
       create-dirs(yes)
       dir-perm(0755)
       perm(0644));
};

log { source(s_rede); destination(d_por_host); };
