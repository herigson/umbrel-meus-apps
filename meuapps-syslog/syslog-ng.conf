@version: 4.11

options {
  # Fecha o arquivo depois de 10 segundos sem mensagem nova.
  #
  # Nao e economia de descritor: e o que faz o botao Apagar funcionar sem
  # reiniciar nada. No Linux, apagar um arquivo que esta aberto nao fecha o
  # arquivo - quem apagou so tirou o nome, e o syslog-ng continuaria
  # escrevendo num inode sem nome, em silencio, ate o processo morrer. Com o
  # reap, ele larga o descritor no primeiro intervalo de silencio e reabre
  # PELO NOME na mensagem seguinte, recriando o arquivo sozinho.
  #
  # O custo e abrir e fechar o arquivo o tempo todo, o que a este volume
  # (alguns KB por mes) nao se mede. A unica janela em que o truque falha e
  # um fluxo continuo sem 10 segundos de folga - ou seja, topicos largos
  # demais, que ja eram problema por outro motivo.
  time-reap(10);
};

# Recebe de qualquer aparelho da LAN que fale syslog.
source s_rede {
  network(transport("udp") port(514));
};

# Um arquivo por host e por dia: /logs/<host>/2026-11-16.log
# As permissoes sao explicitas porque o container "web" (nginx) le este
# mesmo diretorio.
destination d_por_host {
  file("/logs/${HOST}/${YEAR}-${MONTH}-${DAY}.log"
       create-dirs(yes)
       dir-perm(0755)
       perm(0644));
};

log { source(s_rede); destination(d_por_host); };
