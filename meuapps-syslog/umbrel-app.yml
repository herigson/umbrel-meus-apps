manifestVersion: 1
id: meuapps-syslog
name: Syslog
tagline: Servidor de syslog central para os equipamentos da rede
icon: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4dc.svg
category: Networking
version: "4.11.0-3"
port: 8514
description: >-
  Servidor de syslog (syslog-ng) para receber os logs dos equipamentos da
  rede: o roteador MikroTik, os access points, o DVR e qualquer coisa que
  fale syslog.


  Grava um arquivo por host e por dia em texto puro, e cria o diretorio de
  cada aparelho na primeira mensagem que chegar dele. Nao precisa cadastrar
  nada: basta apontar o aparelho para o IP do Umbrel na porta 514/UDP.


  POR QUE ISSO EXISTE: o log de memoria do RouterOS zera a cada reboot, e as
  ONU guardam log em RAM. Toda queda de conexao vinha apagando a propria
  evidencia - em 12/11/2026 a MikroTik reiniciou e levou todo o historico de
  PPPoE com ela, justamente no meio de uma investigacao. Com o log aqui, ele
  sobrevive ao reinicio do aparelho que gerou o evento.


  O botao "Open" abre uma listagem navegavel dos logs, em texto puro e
  somente leitura, atras da autenticacao do Umbrel. Serve pra ler o log do
  roteador pelo navegador durante uma queda, sem precisar abrir SSH.


  ATENCAO: syslog por UDP nao tem autenticacao nem criptografia, e nao
  confirma entrega. Qualquer aparelho da LAN pode injetar linhas, e o que
  passar enquanto este app estiver parado se perde e nao volta. Aceitavel
  numa rede domestica - mas nao exponha a 514 para a internet.


  COMO LIGAR O MIKROTIK (no terminal do roteador):


  /system logging action add name=syslog target=remote remote=<ip-do-umbrel>
  remote-port=514 src-address=<ip-do-roteador>


  /system logging add topics=ppp action=syslog


  O src-address fixo importa: sem ele o roteador escolhe a interface de saida
  e o hostname no log pode variar, o que atrapalha separar por origem.


  Mantenha os topicos ESTREITOS. Em 07/11/2026 o netwatch gerava ~360 linhas
  por hora - nesse ritmo qualquer janela de retencao se autoapaga. Prefira
  ppp, pppoe e interface a um "topics=all".
releaseNotes: >-
  Botao Apagar na tela, que remove do disco o arquivo do dia selecionado, e
  fuso horario cravado no app.


  O FUSO: o umbrelOS vem em UTC de fabrica, e em 16/11/2026 isso colocava 3
  horas de diferenca em todo o log. Pior que o incomodo de ler: o nome do
  arquivo tambem sai em UTC, entao o dia virava as 21h locais e uma queda as
  22h caia no arquivo do dia seguinte - exatamente o tipo de coisa que faz
  voce procurar no dia errado. Agora TZ=America/Sao_Paulo vai no compose,
  que tem precedencia sobre /etc/localtime e sobrevive a um reset do fuso do
  host num upgrade.


  O APAGAR: o nginx passa a aceitar DELETE em /logs/ (dav_methods DELETE),
  e a pagina chama isso com uma confirmacao que nomeia o arquivo. /raw/
  continua somente leitura.


  APAGAR O ARQUIVO DE HOJE nao exige reiniciar nada: o syslog-ng ganhou
  time-reap(10), entao larga o descritor no primeiro intervalo de 10
  segundos sem mensagem e reabre PELO NOME na seguinte, recriando o arquivo
  sozinho. Sem isso, apagar um arquivo aberto no Linux deixaria o syslog-ng
  escrevendo num inode sem nome, em silencio, ate o processo morrer. A
  janela de perda e so o intervalo entre o clique e o reap.


  A alternativa seria o botao reiniciar o container, o que exigiria
  /var/run/docker.sock dentro do nginx - acesso ao socket do Docker e
  equivalente a root no host, e seria um preco alto para apagar um arquivo.
  Pior: durante o restart a 514/udp nao escuta, e UDP nao retransmite.


  O CUSTO QUE SOBRA: o worker do nginx passa a rodar como root, porque
  apagar depende de escrita no DIRETORIO e o syslog-ng cria tudo como root -
  por isso o nginx.conf agora e a config COMPLETA, montada em
  /etc/nginx/nginx.conf, ja que "user" nao existe dentro de conf.d.


  Nao apaga diretorio de host, so arquivos de dia. Um host que fique sem
  nenhum arquivo continua aparecendo no seletor, vazio.


  Versao anterior (4.11.0-1): tela de leitura dos logs, no lugar da listagem
  crua de diretorio.

  Escolha de aparelho e de dia, filtro de texto com destaque e contagem de
  linhas casadas, carimbo de tempo em coluna propria, linhas de erro e de
  aviso realcadas por cor, e um botao Auto que recarrega a cada 10 segundos
  preservando a posicao da rolagem.

  E uma pagina so, SEM NENHUM RECURSO EXTERNO - nada de CDN, fonte ou
  biblioteca de fora. Foi deliberado: esta tela precisa funcionar
  exatamente quando a internet esta fora, que e quando voce vai querer ler
  o log do roteador.

  Nao acrescenta container nem imagem nova. O proprio nginx que ja servia a
  listagem passa a entregar o indice em JSON (autoindex_format json) e a
  pagina consome isso. A alternativa seria Loki mais Grafana: tres
  containers e um indice pesado para alguns KB por mes.

  REDE DE SEGURANCA: /raw/ continua servindo a listagem HTML simples de
  sempre, no mesmo diretorio. Se a pagina quebrar, o acesso aos arquivos
  nao depende dela.


  Versao anterior (4.11.0): primeira versao empacotada na loja.


  Imagem oficial do syslog-ng (balabit/syslog-ng 4.11.0), fixada de proposito
  numa versao de junho de 2026 em vez da 4.12.0, que saiu em 15/11.


  Config versionada NO REPOSITORIO (meuapps-syslog/syslog-ng.conf).


  ATENCAO, medido em 16/11/2026: um Update do app recopia APENAS o
  docker-compose.yml e o umbrel-app.yml. Arquivos auxiliares como
  syslog-ng.conf, nginx.conf e index.html vem SO NA INSTALACAO. Mudar a
  config no repo e clicar Update NAO propaga - e pior, se o compose novo
  mandar montar um arquivo que ainda nao existe em app-data, o Docker cria
  um DIRETORIO no lugar.


  Para alterar config depois de instalado: copiar o arquivo para
  ~/umbrel/app-data/meuapps-syslog/ e reiniciar o app. A saida definitiva e
  assar a config numa imagem propria, porque a tag da imagem vive no
  docker-compose.yml, que esse sim propaga.


  Os logs ficam em app-data, no disco interno - NAO no HD externo. O volume e
  de alguns KB por mes com topicos estreitos, e apontar para o HD traria de
  volta a armadilha do electrs: com o disco desmontado, o Docker cria o
  diretorio vazio no disco interno e isso so aparece meses depois. Volume
  minusculo nao justifica o risco, e em app-data o log entra no backup junto
  com o resto.


  Dois containers de proposito: o syslog-ng recebe e grava, e um nginx
  somente-leitura serve a listagem para o app_proxy. Um servidor de syslog
  nao tem interface web, e a alternativa era um botao "Open" apontando para o
  vazio.


  O arquivo cresce sem limite - sao poucos KB por mes, mas nada apaga nada.
  Se um dia incomodar, "find .../logs -name '*.log' -mtime +365 -delete".
