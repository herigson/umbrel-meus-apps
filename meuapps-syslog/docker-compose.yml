version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meuapps-syslog_web_1
      APP_PORT: 80

  # Recebe syslog em 514/udp e grava um arquivo por host e por dia.
  server:
    # Config assada na imagem (ver .build/syslog). Era um bind mount de
    # ${APP_DATA_DIR}/syslog-ng.conf ate a 4.11.0-4, e isso nao tinha como
    # dar certo: um Update do umbreld recopia APENAS este arquivo e o
    # umbrel-app.yml, entao a config no repo nunca chegava no servidor e
    # cada ajuste virava SSH mais curl na mao. A tag abaixo, sim, propaga.
    image: ghcr.io/herigson/syslog:4.11.0-4
    restart: unless-stopped
    ports:
      - "514:514/udp"
    environment:
      # O umbrelOS vem em UTC de fabrica, e em 16/11/2026 isso colocava 3
      # horas de diferenca em todo o log - pior, o nome do arquivo tambem
      # saia em UTC, entao o dia virava as 21h locais e uma queda as 22h
      # caia no arquivo do dia seguinte.
      TZ: America/Sao_Paulo
    volumes:
      # Unico bind que sobrou, e o unico que faz sentido: o dado.
      - ${APP_DATA_DIR}/logs:/logs
    container_name: meuapps-syslog_server_1

  # Servidor de syslog nao tem interface web, e todos os apps desta loja
  # declaram app_proxy. Em vez de deixar o botao "Open" apontando pro vazio,
  # este nginx serve a tela de leitura dos logs: da pra ler o log do roteador
  # pelo navegador, durante uma queda, sem abrir SSH. Atras da autenticacao
  # do Umbrel (app_proxy).
  web:
    # Pagina e nginx.conf assados na imagem (ver .build/syslog-ui).
    image: ghcr.io/herigson/syslog-ui:4.11.0-4
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    volumes:
      # SEM :ro: o botao de apagar precisa de escrita. So isso nao basta -
      # apagar depende de permissao no DIRETORIO, e e por isso que o worker
      # do nginx roda como root (ver o cabecalho do nginx.conf).
      - ${APP_DATA_DIR}/logs:/logs
    container_name: meuapps-syslog_web_1
