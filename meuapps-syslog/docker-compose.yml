version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meuapps-syslog_web_1
      APP_PORT: 80

  # Recebe syslog em 514/udp e grava um arquivo por host e por dia.
  server:
    image: balabit/syslog-ng:4.11.0
    restart: unless-stopped
    ports:
      - "514:514/udp"
    volumes:
      # Config versionada NO REPO: ela e a fonte da verdade. Edicao manual no
      # servidor nao tem onde sobreviver - foi o modo de falha do NPM na
      # 40443, do datadir do electrs e do i2pd (Guia §14, §19).
      - ${APP_DATA_DIR}/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - ${APP_DATA_DIR}/logs:/logs
      # Timestamps no fuso local, pra cruzar com o log da MikroTik sem
      # conversao mental.
      - /etc/localtime:/etc/localtime:ro
    container_name: meuapps-syslog_server_1

  # Servidor de syslog nao tem interface web, e todos os apps desta loja
  # declaram app_proxy. Em vez de deixar o botao "Open" apontando pro vazio,
  # este nginx serve o diretorio de logs em texto puro: da pra ler o log do
  # roteador pelo navegador, durante uma queda, sem abrir SSH. Somente
  # leitura, e atras da autenticacao do Umbrel (app_proxy).
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_DATA_DIR}/logs:/logs:ro
      - /etc/localtime:/etc/localtime:ro
    container_name: meuapps-syslog_web_1
