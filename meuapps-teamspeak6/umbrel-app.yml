  durante o periodo de avaliacao.


  Porta de voz: 9987/udp. Transferencia de arquivos: 30033/tcp.


  AVISO: software em beta, pode conter bugs e mudar entre versoes.
  Licencas de TS3 nao sao compativeis com TS6.
