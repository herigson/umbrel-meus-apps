version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meuapps-ntp_server_1
      APP_PORT: 8080

  server:
    # chronyd + painel na mesma imagem (ver .build/ntp). Eram dois
    # containers ate a 2.0.0: o painel nao conseguia reescrever a
    # configuracao do chrony nem reinicia-lo, porque um container nao
    # reinicia o vizinho sem o socket do Docker - que o Umbrel proibe. Com
    # os dois juntos, tudo se configura pela interface e o painel ainda
    # ganha acesso ao chronyc em 127.0.0.1.
    image: ghcr.io/herigson/ntp:2.0.0
    restart: unless-stopped
    ports:
      - "123:123/udp"
    volumes:
      # config.json mora aqui e sobrevive aos updates. Antes a configuracao
      # vinha de variavel de ambiente e o /etc/chrony era um tmpfs: qualquer
      # ajuste exigia editar este arquivo e recriar o container.
      - ${APP_DATA_DIR}/data:/data
    environment:
      LISTEN_PORT: "8080"
      POLL_SECONDS: "15"
      CLIENTS_TTL: "30"
    # Sem cap_add SYS_TIME de proposito: o chronyd roda com "-x", que
    # explicitamente NAO ajusta o relogio. O relogio e do host do Umbrel e
    # quem o corrige e o timesyncd dele; dois servicos disciplinando o mesmo
    # relogio brigariam. Este servidor mede o desvio e serve a hora.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
