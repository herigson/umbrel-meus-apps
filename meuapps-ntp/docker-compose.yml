version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meuapps-ntp_status_1
      # Pagina de status simples so pro botao Open ter o que mostrar;
      # o servico de verdade e o chrony na 123/udp.
      APP_PORT: 8123
      PROXY_AUTH_ADD: "false"

  server:
    image: cturra/ntp:latest
    restart: unless-stopped
    # SYS_TIME: deixa o chrony disciplinar o relogio do kernel (que e
    # compartilhado com o host) - o Umbrel inteiro ganha hora precisa.
    cap_add:
      - SYS_TIME
    ports:
      - "123:123/udp"
    environment:
      # Upstream: NTP.br (oficiais brasileiros) + Cloudflare como reserva.
      NTP_SERVERS: "a.st1.ntp.br,b.st1.ntp.br,time.cloudflare.com"
    tmpfs:
      - /etc/chrony:rw,mode=1750
      - /run/chrony:rw,mode=1750

  status:
    image: busybox:1.36.1
    restart: unless-stopped
    command: sh -c 'mkdir -p /www && echo "<h1>Servidor NTP ativo</h1><p>Aponte os clientes NTP para o IP do Umbrel, porta 123/UDP.</p>" > /www/index.html && httpd -f -p 8123 -h /www'
