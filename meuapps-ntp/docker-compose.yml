version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meuapps-ntp_ui_1
      APP_PORT: 8080

  server:
    image: cturra/ntp:latest
    restart: unless-stopped
    ports:
      - "123:123/udp"
    environment:
      # Upstream: NTP.br (oficiais brasileiros) + Cloudflare como reserva.
      NTP_SERVERS: "a.st1.ntp.br,b.st1.ntp.br,time.cloudflare.com"
    tmpfs:
      - /etc/chrony:rw,mode=1750
      - /run/chrony:rw,mode=1750
    # Sem cap_add SYS_TIME de proposito: o startup.sh da imagem roda
    # "chronyd -x", que explicitamente NAO ajusta o relogio do sistema. A
    # capability nao teria efeito nenhum - o container serve a hora do host
    # e mede o desvio pra reportar.

  ui:
    # Painel web (ver .build/ntp-ui). Fala o proprio protocolo NTP: o chrony
    # desta imagem nao expoe a porta de comando (323) fora do localhost,
    # entao chronyc remoto nao e opcao.
    image: ghcr.io/herigson/ntp-ui:1.0.0
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # Nome COMPLETO do container (o nome curto do servico nao resolve na
      # rede do Umbrel); a lista e testada em ordem.
      NTP_HOST: "meuapps-ntp_server_1,server,meuapps-ntp-server-1"
      # Fontes usadas pra medir o desvio do nosso relogio. Comparar com o
      # servidor local daria sempre zero: mesmo relogio do host.
      REFERENCE_SERVERS: "a.st1.ntp.br,b.st1.ntp.br"
      LOCAL_POLL_SECONDS: "20"
      REFERENCE_POLL_SECONDS: "120"
      HISTORY_POINTS: "360"
    deploy:
      resources:
        limits:
          cpus: "0.25"
