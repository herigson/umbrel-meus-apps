manifestVersion: 1
id: meuapps-ntp
name: Servidor NTP (chrony)
tagline: Servidor de hora (NTP) para toda a rede local
icon: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f550.svg
category: Networking
version: "1.2.0"
port: 8123
description: >-
  Servidor NTP local usando chrony (imagem cturra/ntp). O Umbrel passa a
  servir hora precisa na porta 123/UDP para todos os dispositivos da rede -
  roteador MikroTik, cameras, PCs, IoT - sem que cada um precise falar com a
  internet.


  O chrony sincroniza com os servidores oficiais do NTP.br (a.st1.ntp.br /
  b.st1.ntp.br) e usa time.cloudflare.com como reserva, e dai distribui a
  hora localmente.


  Para usar: aponte o cliente NTP dos dispositivos (ou a opcao 42 do DHCP no
  MikroTik) para o IP do Umbrel, porta 123/UDP - o proprio painel traz os
  comandos prontos pra MikroTik, Windows e Linux.


  O botao Open abre um painel com a hora servida e o fuso configurado, o
  desvio do relogio medido contra as fontes publicas, historico em grafico,
  stratum, fonte de referencia, ultimo sync e a qualidade da sincronizacao.
releaseNotes: >-
  Painel ganha o relogio: hora servida em destaque (com o segundo correndo),
  data por extenso e o fuso configurado, com a sigla e o deslocamento em
  relacao ao UTC. A hora exibida e a do SERVIDOR - o painel calcula a
  diferenca pro relogio do navegador, entao continua correta mesmo num
  dispositivo desacertado. O fuso vem da variavel TZ do container e nao
  afeta o protocolo, que trafega UTC.


  Sai a secao com os comandos de configuracao de dispositivos: eram
  especificos de uma rede. No lugar, o cartao do relogio mostra o endereco e
  a porta em que o servidor esta atendendo.


  Versao anterior (1.1.0): trocou a pagina estatica de status por um painel
  de verdade (imagem ghcr.io/herigson/ntp-ui), com desvio do relogio em
  grafico historico, stratum, fonte de referencia, ultimo sync, erro
  estimado (root dispersion) e a tabela das fontes externas.


  O painel fala o proprio protocolo NTP - o chrony desta imagem nao expoe a
  porta de comando (323) fora do localhost, entao chronyc remoto nao e
  opcao. O desvio e medido contra as fontes publicas: comparar o painel com
  o servidor local daria sempre zero, ja que os dois containers usam o mesmo
  relogio do host.


  Remove o cap_add SYS_TIME, que nao tinha efeito: o startup.sh da imagem
  roda "chronyd -x", que explicitamente nao ajusta o relogio do sistema.
