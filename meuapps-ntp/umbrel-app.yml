manifestVersion: 1
id: meuapps-ntp
name: Servidor NTP (chrony)
tagline: Servidor de hora (NTP) para toda a rede local
icon: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f550.svg
category: Networking
version: "2.0.1"
port: 8123
description: >-
  Servidor NTP local usando chrony (imagem cturra/ntp). O Umbrel passa a
  servir hora precisa na porta 123/UDP para todos os dispositivos da rede -
  roteador MikroTik, cameras, PCs, IoT - sem que cada um precise falar com a
  internet.


  O chrony sincroniza com os servidores oficiais do NTP.br (a.st1.ntp.br /
  b.st1.ntp.br) e usa time.cloudflare.com como reserva, e dai distribui a
  hora localmente.


  Para usar: aponte o cliente NTP dos dispositivos (ou a opcao 42 do DHCP no
  MikroTik) para o IP do Umbrel, porta 123/UDP - o proprio painel traz os
  comandos prontos pra MikroTik, Windows e Linux.


  TUDO SE CONFIGURA PELO PROPRIO APP. Abra o painel e va em Fontes ou
  Ajustes: adicionar e remover servidores, testar um endereco antes de
  salvar, escolher as redes que podem consultar, o intervalo de consulta e
  as fontes minimas. Nao e preciso editar docker-compose.yml, e a
  configuracao fica em ${APP_DATA_DIR}, sobrevivendo aos updates.


  O painel mostra a hora servida com o segundo correndo, o desvio do
  relogio com historico de 1h a 7 dias, stratum, erro estimado, atraso ate
  a origem, o estado de cada fonte - e QUEM NA REDE esta pedindo hora, que
  e a unica forma de confirmar que os aparelhos realmente trocaram de
  servidor.


  Este servidor nao acerta o relogio da maquina: ele mede o desvio e
  distribui a hora. O relogio e do host do Umbrel e quem o corrige e o
  servico de tempo dele.
releaseNotes: >-
  Corrige tres defeitos da 2.0.0, todos visiveis no primeiro uso.


  O supervisor estourava "UnboundLocalError: _proc" a cada 5 segundos. A
  funcao supervise() atribui a _proc sem declarar "global _proc", e em
  Python isso torna o nome LOCAL na funcao inteira - entao a leitura logo
  acima dele falhava. O chronyd subia na inicializacao e servia hora
  normalmente, mas ninguem o teria reerguido se morresse. O mesmo defeito
  estava no NerdMiner desde o primeiro dia (corrigido na 27.5.1).


  A tela de Fontes dizia "aguardando primeira consulta" com as fontes
  funcionando. O chronyc devolve o ENDERECO resolvido (200.160.7.186) e a
  config guarda o NOME (a.st1.ntp.br); casando as duas listas pelo nome,
  nunca havia par. Agora o chronyc e chamado com -N, que pede os nomes
  originais. O painel tambem passa a mostrar o nome em vez do IP.


  O cartao "Precisao" ficava vazio. O painel pergunta a hora ao proprio
  servidor em 127.0.0.1 pra ler esse campo do pacote NTP, mas o
  chrony.conf gerado so tinha "allow" para as redes configuradas - e
  localhost nao estava em nenhuma, entao o servidor recusava a si mesmo.
  Agora ha sempre "allow 127.0.0.1".


  O fuso horario virou uma LISTA, em vez de campo de texto. As opcoes saem
  do tzdata instalado no container, nao de uma lista escrita a mao que
  envelheceria junto com as regras de horario de verao.


  No CI entrou o pylint (E0601/E0602). O py_compile que ja rodava nao pegava
  o erro do _proc: e erro de execucao, nao de sintaxe.


  A 2.0.0 trouxe o resto: TUDO SE CONFIGURA PELO PROPRIO APP, e o painel foi refeito.


  Ate agora o app eram dois containers: o chrony e o painel. A configuracao
  do chrony vinha de variavel de ambiente e o /etc/chrony era um tmpfs
  recriado a cada arranque - mudar qualquer ajuste exigia editar o
  docker-compose.yml na mao e recriar o container. O painel nao tinha como
  fazer isso: um container nao reinicia o vizinho sem o socket do Docker,
  que o Umbrel proibe.


  Agora e um container so (chronyd + painel + supervisor) e a configuracao
  vive em ${APP_DATA_DIR}/config.json, sobrevivendo aos updates. Da pra
  ligar e desligar o atendimento a rede, escolher as redes permitidas,
  adicionar e remover fontes (com teste de resposta antes de salvar),
  marcar fonte preferida, iburst e NTS por fonte, mudar o intervalo de
  consulta, as fontes minimas e o fuso do painel - tudo pela interface.


  O GANHO ESCONDIDO: com o chronyd no mesmo container, o painel passou a
  falar chronyc em 127.0.0.1 e mostra os numeros que o proprio chrony
  calcula, em vez de estimar por fora com NTP cru. Isso trouxe uma tela que
  nao existia - QUEM NA REDE ESTA PEDINDO HORA. E a unica forma de confirmar
  que o roteador, as cameras e os PCs realmente trocaram de servidor.


  Painel novo em cinco telas, com o visual refeito: Painel (relogio, desvio,
  stratum, erro estimado, atraso, fontes e clientes), Fontes (lista, detalhe
  e opcoes por fonte), Adicionar fonte (com sugestoes e botao Testar),
  Historico (1h / 12h / 24h / 7 dias, com desvio e ida-e-volta) e Ajustes.


  O intervalo de consulta aparece como 1, 2, 4 e 17 min porque o chrony
  conta em potencias de 2 segundos: sao 2^6, 2^7, 2^8 e 2^10. Os rotulos
  caem exatos na escala dele, sem arredondamento.


  O QUE NAO ENTROU, e por que: um controle de "corrigir saltos grandes"
  (makestep). O chronyd roda com -x, que desliga o ajuste de relogio de
  proposito - o relogio e do host do Umbrel e quem o corrige e o servico de
  tempo dele. Esse botao seria um interruptor desligado de fabrica. No lugar
  dele, Ajustes traz uma linha explicando de quem e o relogio.


  Versao anterior (1.2.0): painel ganhou o relogio - hora servida em destaque (com o segundo correndo),
  data por extenso e o fuso configurado, com a sigla e o deslocamento em
  relacao ao UTC. A hora exibida e a do SERVIDOR - o painel calcula a
  diferenca pro relogio do navegador, entao continua correta mesmo num
  dispositivo desacertado. O fuso vem da variavel TZ do container e nao
  afeta o protocolo, que trafega UTC.


  Sai a secao com os comandos de configuracao de dispositivos: eram
  especificos de uma rede. No lugar, o cartao do relogio mostra o endereco e
  a porta em que o servidor esta atendendo.


  Versao anterior (1.1.0): trocou a pagina estatica de status por um painel
  de verdade (imagem ghcr.io/herigson/ntp-ui), com desvio do relogio em
  grafico historico, stratum, fonte de referencia, ultimo sync, erro
  estimado (root dispersion) e a tabela das fontes externas.


  O painel fala o proprio protocolo NTP - o chrony desta imagem nao expoe a
  porta de comando (323) fora do localhost, entao chronyc remoto nao e
  opcao. O desvio e medido contra as fontes publicas: comparar o painel com
  o servidor local daria sempre zero, ja que os dois containers usam o mesmo
  relogio do host.


  Remove o cap_add SYS_TIME, que nao tinha efeito: o startup.sh da imagem
  roda "chronyd -x", que explicitamente nao ajusta o relogio do sistema.
